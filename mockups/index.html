<style>
:root{color-scheme:light dark}*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:#14161c;color:#eef1f7;padding:0 0 4rem}
nav{position:sticky;top:0;z-index:5;background:#14161cee;backdrop-filter:blur(8px);display:flex;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid #2a2f3a}

.stack{display:grid;gap:2.2rem}

.win{background:#14161c}.bar{display:flex;align-items:center;gap:6px;background:#2a2f3a;padding:.5rem .8rem;border-radius:12px 12px 0 0}

.win img{width:100%;height:auto;display:block;background:#fff}
.row{display:flex;gap:1.6rem;overflow-x:auto;padding:.5rem 0 1.5rem;scroll-snap-type:x proximity}
.phone{flex:0 0 240px;scroll-snap-align:start}
.bezel{border:8px solid #000;border-radius:34px;overflow:hidden;box-shadow:0 14px 40px #0009;background:#fff;outline:2px solid #3a4150}
.bezel img{width:100%;display:block}
